[project]
nav = [
  { "Overview" = "index.md"},
  { "Data Collection via Emergency Test" = "emergency-test.md"},
  { "Discussion and Help" = "help.md"},
  #{ "Migrating to VDR/VER" = [
    #{ "Customer Experience" = "cx.md" },
  #  { "FAQs" = "faq.md" },
  #]},
  { "Progress Reports" = [
    { "Required Information" = "report.md" },
    { "Reference List of Applicable Rules" = "reference.md"},
    { "Schemas & Templates" = "schemas.md" },
    { "Corrective Action Plans" = "cap.md" },
    { "Validators" = "validate.md" },
      { "Examples" = [
      "examples/index.md",
      { "Aster Operations Cloud" = "examples/aster.md" },
      { "Harbor Agency Workspace" = "examples/harbor.md" },
      { "Smallbrook Public Information Workspace" = "examples/smallbrook.md" },
    ]},
    { "Submitting Updates" = "submitting-updates.md"},

  ]},
  { "Monitoring this Site" = [
    { "Changelog" = "changelog.md"},
    { "Sources and Agent Information" = "sources.md"},
  ]},
  { "--> return to FedRAMP.gov" = "/" },
]

site_name = "VDR/VER Migration Resources"
site_description = "Resources to help cloud services navigate the mandatory FedRAMP VDR/VER migration and related enforcement process."
site_author = "pete@fedramp.gov"
docs_dir = "content/"
site_dir = "html/"
site_url = "https://www.fedramp.gov/vdr-migration"
repo_url = "https://github.com/FedRAMP/vdr-migration"
repo_name = "FedRAMP/vdr-migration"
copyright = "fedramp.gov"
extra_css = ["stylesheets/extra.css"]

extra_javascript = [
  "javascripts/validate.js",
  "https://www.fedramp.gov/javascripts/dap.js"
]

[project.extra]
homepage = "/vdr-migration"

[project.extra.analytics]
provider = "google"
property = "G-E1PPDRDY5R"

[project.extra.analytics.feedback]
title = "Was this page helpful?"

[[project.extra.analytics.feedback.ratings]]
icon = "material/emoticon-happy-outline"
name = "This page was helpful"
data = 1
note = "Thanks for your feedback!"

[[project.extra.analytics.feedback.ratings]]
icon = "material/emoticon-sad-outline"
name = "This page could be improved"
data = 0
note = "Thanks for your feedback!"


[project.theme]
custom_dir = "overrides"
logo = "assets/fr-only-logo-black.png"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.prune",
  "navigation.sections",
  #"navigation.tabs",
  #"navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  #"navigation.expand",
  "search.highlight",
  "toc.follow",
  #"toc.integrate",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.validation]
unresolved_references = false

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}

[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.plugins.tags]

[project.plugins.social]
enabled = true
cards_layout = "fedramp"
cards_layout_dir = "overrides/layouts"

[project.plugins.social.cards_layout_options]
background_color = "#f4f6f8"
color = "#162e51"
logo = "overrides/assets/fr-only-logo-black.png"

[project.plugins.rss]
enabled = true
feed_title = "VDR/VER Migration Resources Changelog"
match_path = "^changelog\\.md$"
length = 1
abstract_chars_count = 4096

[project.plugins.rss.date_from_meta]
as_creation = "created"
as_update = "updated"
datetime_format = "%Y-%m-%dT%H:%M:%S%z"
default_timezone = "America/New_York"
